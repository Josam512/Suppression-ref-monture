name: AFM Maryll ZIP
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 Pillow
      - name: Download and verify all published AFM photos
        run: python tools/afm_run_complete.py
      - name: Upload final ZIP and control files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AFM-Maryll-Optiques-ZIP-FINAL
          path: |
            AFM_Maryll_Optiques_FACE_PROFIL_COMPLET.zip
            AFM_Maryll_Optiques/CONTROLE_FINAL.txt
            AFM_Maryll_Optiques/MANIFESTE_PHOTOS.csv
            AFM_Maryll_Optiques/ERREURS.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
