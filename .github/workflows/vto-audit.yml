name: VTO audit

on:
  pull_request:
    branches:
      - claude/virtual-try-on-no-card-434axf
  push:
    branches:
      - chatgpt/vto-stability-audit

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run journey
