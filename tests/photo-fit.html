<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Essayage sur photo fixe — CI uniquement</title>
  </head>
  <body>
    <p id="status">chargement…</p>
    <script type="module">
      import { detectOnImage } from '/src/prep/detectOnImage.ts';
      import { frameMetrics } from '/src/core/faceMetrics.ts';
      import { parseFrameSpec } from '/src/core/frameSpec.ts';
      import { drawFrame } from '/src/render/composite.ts';
      import { verdict, legend } from '/src/core/verdict.ts';

      const load = (src) =>
        new Promise((ok, ko) => {
          const i = new Image();
          i.onload = () => ok(i);
          i.onerror = () => ko(new Error(src));
          i.src = src;
        });

      /**
       * Compose une monture preparee sur une photo fixe, a l'echelle reelle.
       *
       * `faceWidthMm` est ce que les reperes 234/454 valent en millimetres sur
       * CETTE photo — mesure via la monture reellement portee, dont la largeur
       * est connue au reglet. C'est la seule entree d'echelle.
       */
      window.__fit = async ({ photo, slug, faceWidthMm, paddingMm = 0 }) => {
        const img = await load(photo);
        const det = await detectOnImage(img);
        if (det === null) return { ok: false, why: 'aucun visage detecte' };

        const spec = parseFrameSpec(await (await fetch(`/frames/${slug}/spec.json`)).json());
        const front = await load(`/frames/${slug}/${spec.front}`);
        const profile = await load(`/frames/${slug}/${spec.profile}`);

        const W = img.naturalWidth;
        const H = img.naturalHeight;
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const cal = { faceWidthMm, source: 'worn-frame', relError: 0.02, measuredAt: 0 };
        const m = frameMetrics(det.landmarks, W, H, cal, det.yawRad);

        drawFrame(
          ctx,
          { front: { img: front, spec }, profile: { img: profile, spec } },
          m,
          null,
          { overlayPaddingMm: paddingMm },
        );

        const v = verdict(det.landmarks, cal, spec, W, H, det.yawRad);
        return {
          ok: true,
          slug,
          livePxPerMm: m.livePxPerMm,
          yawDeg: (det.yawRad * 180) / Math.PI,
          frameWidthMm: spec.totalWidthMm,
          legende: v === null ? null : legend(v),
          status: v === null ? null : v.status,
          image: canvas.toDataURL('image/jpeg', 0.9),
        };
      };

      document.getElementById('status').textContent = 'ready';
    </script>
  </body>
</html>
