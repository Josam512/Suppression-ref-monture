    <title>Essayage virtuel — vérification de taille réelle</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #111;
        color: #eee;
      }
      /* Le miroir s'applique UNE SEULE FOIS, ici (CLAUDE.md §6).
         core/ travaille toujours en coordonnées non miroitées. */
      .stage {
        position: relative;
        width: fit-content;
        /* ⚠️ Sans cette borne, la vidéo s'affiche à sa taille NATIVE — 1080×1920
           sur un téléphone. L'écran ne montrait alors qu'un plafond et un
           menton, et rien ne le signalait : la mesure, elle, tourne sur les
           pixels de la vidéo, pas sur ce qu'on en voit. */
        max-width: 100%;
        transform: scaleX(-1);
      }
      .stage video {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .stage canvas {
        display: block;
        position: absolute;
        inset: 0;
        /* Le canvas garde sa résolution interne (celle de la vidéo) et se laisse
           mettre à l'échelle par le CSS, comme la vidéo au-dessus de laquelle il
           est posé. Sans ça, les deux se décalent dès que l'écran est étroit. */
        width: 100%;
        height: 100%;
      }
      .stage[hidden] {
        display: none;
      }
    </style>
